# Runs SQL Server, the API and the website. Copy .env.example to .env and set the passwords first.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=db,1433;Database=LandingCms;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      Cors__AllowedOrigins__0: ${SITE_URL:-http://localhost:4321}
      Database__MigrateAndSeedOnStartup: "true"
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Seed__DemoContent: ${SEED_DEMO_CONTENT:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    volumes:
      - uploads:/app/uploads
    ports:
      - "5040:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:4321}
      # The server talks to the API over the compose network; browsers use the published port.
      API_URL: http://backend:8080
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5040}
    ports:
      - "4321:4321"

volumes:
  sqldata:
  uploads:
